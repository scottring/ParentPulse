name: Relish
options:
  bundleIdPrefix: my.relish
  deploymentTarget:
    iOS: '27.1'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '2'
    DEVELOPMENT_TEAM: XT33G7U496
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    RELISH_START_URL: 'https:/$()/app.relish.my/relish/'
targets:
  Relish:
    type: application
    platform: iOS
    sources: [Relish]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: my.relish.book
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Relish/Relish.entitlements
    info:
      path: Relish/Info.plist
      properties:
        CFBundleDisplayName: Relish
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        RelishStartURL: $(RELISH_START_URL)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        NSCameraUsageDescription: Take a photo you choose to keep in your encrypted Relish book.
        NSMicrophoneUsageDescription: Record a short story. You choose whether to send it for transcription.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - sdk: WebKit.framework
  RelishTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RelishTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: my.relish.book.tests
    dependencies:
      - target: Relish
schemes:
  Relish:
    build:
      targets:
        Relish: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [RelishTests]
    archive:
      config: Release
